{% extends "base.html" %}{% block actions %}<a class="btn btn-success" href="/reports/{{kind}}.csv{% if start or end %}?start={{start or ''}}&end={{end or ''}}{% endif %}">Export CSV</a>{% endblock %}{% block content %}<section class="panel"><form class="filter-bar"><select class="form-select" name="kind">{% for value,label in [('active-members','Active members'),('expired-memberships','Expired memberships'),('expiring-soon','Expiring soon'),('attendance','Attendance'),('payments','Payments'),('revenue','Revenue'),('new-members','New members')] %}<option value="{{value}}" {% if kind==value %}selected{% endif %}>{{label}}</option>{% endfor %}</select><input class="form-control" type="date" name="start" value="{{start or ''}}"><input class="form-control" type="date" name="end" value="{{end or ''}}"><button class="btn btn-dark">Run report</button></form><div class="table-responsive"><table class="table"><thead><tr>{% for cell in rows[0] %}<th>{{cell}}</th>{% endfor %}</tr></thead><tbody>{% for row in rows[1:] %}<tr>{% for cell in row %}<td>{{cell}}</td>{% endfor %}</tr>{% else %}<tr><td colspan="{{rows[0]|length}}" class="empty">No matching records.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
