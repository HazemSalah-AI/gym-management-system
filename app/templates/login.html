{% extends "base.html" %}{% block public_content %}
<main class="login-shell">
  <section class="login-card">
    <div class="brand dark">GYM<span>OPS</span></div>
    <p class="text-secondary mt-3">Sign in to manage gym operations.</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" name="username" required autofocus autocomplete="username">
      <label class="form-label" for="password">Password</label><input class="form-control mb-4" id="password" name="password" type="password" required autocomplete="current-password">
      <button class="btn btn-success w-100">Sign in</button>
    </form>
  </section>
</main>{% endblock %}
